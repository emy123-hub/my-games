<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number 🎮</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #ede9fe, #fef9c3);
    background-size: 200% 200%;
    animation: bgMove 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255, 255, 255, 0.9);
    padding: 36px 32px;
    border-radius: 24px;
    text-align: center;
    width: 340px;
    box-shadow: 0 12px 40px rgba(99, 102, 241, 0.18);
    border: 1px solid rgba(255,255,255,0.7);
  }
  h1 {
    color: #4f46e5;
    margin: 0 0 8px;
    font-size: 30px;
    text-shadow: 0 0 18px rgba(129, 140, 248, 0.45);
  }
  p.sub { color: #64748b; margin: 0 0 20px; font-size: 15px; }
  input {
    padding: 12px;
    font-size: 20px;
    width: 140px;
    text-align: center;
    border: 2px solid #c7d2fe;
    border-radius: 14px;
    outline: none;
    color: #1e293b;
  }
  input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129,140,248,0.15); }
  button {
    padding: 12px 26px;
    font-size: 17px;
    font-weight: bold;
    background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
    color: #1e293b;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 14px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 14px rgba(125, 211, 252, 0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(125,211,252,0.55); }
  #message { font-size: 18px; font-weight: bold; margin: 18px 0 6px; min-height: 26px; }
  #tries {
    display: inline-block;
    background: #f1f5f9;
    color: #475569;
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 14px;
    margin-top: 6px;
  }
  #again {
    display: none;
    background: linear-gradient(135deg, #86efac, #6ee7b7);
    margin-top: 16px;
  }
  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    border-radius: 3px;
    animation: fall linear forwards;
    z-index: 999;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>
<div class="card">
  <h1>🎮 Guess the Number</h1>
  <p class="sub">I've picked a number between 1 and 100.<br>Can you guess it?</p>
  <input type="number" id="guess" min="1" max="100" placeholder="1-100">
  <br>
  <button onclick="check()">Guess</button>
  <p id="message"></p>
  <span id="tries" style="display:none;"></span>
  <br>
  <button onclick="newGame()" id="again">🔄 Play Again</button>
</div>
<script>
  let secret = Math.floor(Math.random() * 100) + 1;
  let tries = 0;
  const colours = ["#7dd3fc", "#a5b4fc", "#6ee7b7", "#fde68a", "#c4b5fd"];

  function check() {
    const input = document.getElementById("guess");
    const g = Number(input.value);
    const msg = document.getElementById("message");
    const triesEl = document.getElementById("tries");
    if (!g || g < 1 || g > 100) {
      msg.textContent = "Please enter a number from 1 to 100";
      msg.style.color = "#d97706";
      return;
    }
    tries++;
    triesEl.style.display = "inline-block";
    triesEl.textContent = "Tries: " + tries;
    if (g === secret) {
      msg.textContent = "🎉 Correct! You win!";
      msg.style.color = "#16a34a";
      triesEl.textContent = "Won in " + tries + " tries! 🏆";
      document.getElementById("again").style.display = "inline-block";
      launchConfetti();
    } else if (g < secret) {
      msg.textContent = "📈 Too low — try a bigger number";
      msg.style.color = "#d97706";
    } else {
      msg.textContent = "📉 Too high — try a smaller number";
      msg.style.color = "#2563eb";
    }
    input.value = "";
    input.focus();
  }

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;
    tries = 0;
    document.getElementById("message").textContent = "";
    const triesEl = document.getElementById("tries");
    triesEl.style.display = "none";
    triesEl.textContent = "";
    document.getElementById("guess").value = "";
    document.getElementById("again").style.display = "none";
  }

  function launchConfetti() {
    for (let i = 0; i < 60; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colours[Math.floor(Math.random() * colours.length)];
      c.style.animationDuration = (2 + Math.random() * 2) + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  document.getElementById("guess").addEventListener("keydown", function(e) {
    if (e.key === "Enter") check();
  });
</script>
</body>
</html>
